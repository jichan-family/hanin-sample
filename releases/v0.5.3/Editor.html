  setTool(t, tpl) {

  // ---------- 상태 ----------

  isEmpty() { return this.atoms.length === 0; }
  clearAll() { this.atoms = []; this.bonds = []; this.sel.clear(); this.undoStack = []; this.redoStack = []; this.redraw(); }

      if (far.length) { const F = this.atoms[far[0]]; return cands.sort((a, b) => Math.hypot(A.x + Math.cos(b) - F.x, A.y + Math.sin(b) - F.y) - Math.hypot(A.x + Math.cos(a) - F.x, A.y + Math.sin(a) - F.y))[0]; }
      return cands.sort((a, b) => Math.abs(Math.sin(a) + 0.5) - Math.abs(Math.sin(b) + 0.5))[0];

    let gap = 0, at = 0; s.forEach((a, k) => { const n = k + 1 < s.length ? s[k + 1] : s[0] + 2 * Math.PI; if (n - a > gap) { gap = n - a; at = a + gap / 2; } });

  }
  branch(i, o = 1, el = 'C', ang) {
    const A = this.atoms[i]; const a = ang ?? this.freeAngle(i);

  }
  ringPoints(n, cx, cy, start) { const R = 1 / (2 * Math.sin(Math.PI / n)); return Array.from({ length: n }, (_, k) => ({ x: cx + R * Math.cos(start + 2 * Math.PI * k / n), y: cy + R * Math.sin(start + 2 * Math.PI * k / n) })); }
  makeRing(pts, aromatic) {
    const idx = pts.map(p => this.addAtom(p.x, p.y)); const bs = [];
    for (let k = 0; k < idx.length; k++) bs.push(this.addBond(idx[k], idx[(k + 1) % idx.length], 1));
    if (aromatic) {
      const hasDouble = i => this.bonds.some((b, bi) => !bs.includes(bi) && (b.a === i || b.b === i) && b.o === 2);
      for (const off of [0, 1]) {
        const ok = bs.every((bi, k) => (k % 2 !== off) || (!hasDouble(this.bonds[bi].a) && !hasDouble(this.bonds[bi].b)));
        if (ok || off === 1) { bs.forEach((bi, k) => { if (k % 2 === off && !hasDouble(this.bonds[bi].a) && !hasDouble(this.bonds[bi].b)) this.bonds[bi].o = 2; }); break; }

  }
  placeRing(n, aromatic, p) {
    const ai = this.hitAtom(p), bi = ai < 0 ? this.hitBond(p) : -1;
    if (bi >= 0) { // 결합에 융합
      const b = this.bonds[bi], A = this.atoms[b.a], B = this.atoms[b.b];
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, nx = -(B.y - A.y), ny = B.x - A.x;
      const side = this.atoms.reduce((s, a, k) => k === b.a || k === b.b ? s : s + Math.sign((a.x - mx) * nx + (a.y - my) * ny), 0);

      const cx = mx + dir * nx * d, cy = my + dir * ny * d;

    }
    if (ai >= 0) { // 원자에 붙이기
      const A = this.atoms[ai], a = this.freeAngle(ai), R = 1 / (2 * Math.sin(Math.PI / n));
      const cx = A.x + Math.cos(a) * R, cy = A.y + Math.sin(a) * R;

  placeTemplate(k, p) {
    const m = window.S.OCL.Molecule.fromSmiles(TEMPLATES[k][1]);
    const t = this.fromOCL(m); if (!t.atoms.length) return;
    const ai = this.hitAtom(p); let dx, dy, rot = 0, anchor = 0;
    // 붙일 원자: 첫 원자(아크릴레이트·설포닐은 끝 원자)
    const tb = t.bonds; const deg = i => tb.filter(b => b.a === i || b.b === i).length;
    if (ai >= 0) {
      anchor = t.atoms.findIndex((a, i) => a.el === 'C' && deg(i) < 3); if (anchor < 0) anchor = 0;
      const A = this.atoms[ai], ang = this.freeAngle(ai), tx = A.x + Math.cos(ang), ty = A.y + Math.sin(ang);
      const T = t.atoms[anchor], cx = t.atoms.reduce((s, a) => s + a.x, 0) / t.atoms.length, cy = t.atoms.reduce((s, a) => s + a.y, 0) / t.atoms.length;
      rot = ang - Math.atan2(cy - T.y, cx - T.x);
      const r = (x, y) => ({ x: (x - T.x) * Math.cos(rot) - (y - T.y) * Math.sin(rot) + tx, y: (x - T.x) * Math.sin(rot) + (y - T.y) * Math.cos(rot) + ty });
      t.atoms.forEach(a => Object.assign(a, r(a.x, a.y)));
    } else {
      const cx = t.atoms.reduce((s, a) => s + a.x, 0) / t.atoms.length, cy = t.atoms.reduce((s, a) => s + a.y, 0) / t.atoms.length;
      t.atoms.forEach(a => { a.x += p.x - cx; a.y += p.y - cy; });
    }
    const map = t.atoms.map(a => { const i = this.addAtom(a.x, a.y, a.el); this.atoms[i].el = a.el; this.atoms[i].q = a.q; return i; });
    t.bonds.forEach(b => { const bi = this.addBond(map[b.a], map[b.b], b.o); this.bonds[bi].o = b.o; });

  deleteAtoms(set) {
    const keep = this.atoms.map((_, i) => !set.has(i)); const re = []; let n = 0; keep.forEach((k, i) => re[i] = k ? n++ : -1);

  }
  pruneLonely(cands) { const lone = new Set(cands.filter(i => i < this.atoms.length && this.atoms[i].el === 'C' && !this.nbrs(i).length && !this.atoms[i].q)); if (lone.size) this.deleteAtoms(lone); }
  // ---------- 마우스 ----------
  bindEvents() {
    const svg = this.svg; let drag = null;

      svg.focus(); svg.setPointerCapture(ev.pointerId);
      const p = this.toModel(ev); drag = { p0: p, p, ai: this.hitAtom(p), bi: -1, moved: false };
      if (drag.ai < 0) drag.bi = this.hitBond(p);
      if (this.tool === 'select' && drag.ai >= 0 && this.sel.has(drag.ai)) { this.push(); drag.move = true; }
      else if (this.tool === 'select' && drag.ai >= 0) { this.sel = new Set([drag.ai]); this.push(); drag.move = true; this.redraw(); }
    });

      const p = this.toModel(ev);

      if (drag.move) { const dx = p.x - drag.p.x, dy = p.y - drag.p.y; this.sel.forEach(i => { this.atoms[i].x += dx; this.atoms[i].y += dy; }); drag.p = p; this.redraw(); return; }

      const k = ev.key.toLowerCase();
      if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); this.undo(); }
      else if ((ev.ctrlKey || ev.metaKey) && (k === 'y' || (ev.shiftKey && k === 'z'))) { ev.preventDefault(); this.redo(); }
      else if ((ev.ctrlKey || ev.metaKey) && k === 'a') { ev.preventDefault(); this.setTool('select'); this.sel = new Set(this.atoms.map((_, i) => i)); this.redraw(); }

  rectSet(a, b) { const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x), y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y); return new Set(this.atoms.map((t, i) => t.x >= x0 && t.x <= x1 && t.y >= y0 && t.y <= y1 ? i : -1).filter(i => i >= 0)); }

  }
  valenceIssues() {
    const bad = new Map();
    this.atoms.forEach((a, i) => {
      if (a.el === 'C' && a.q > 0) { bad.set(i, '탄소에 + 전하 (카보양이온) — 의도한 것인지 확인'); return; }
      const v = VAL[a.el]; if (v == null) return;
      let used = 0; this.bonds.forEach(b => { if (b.a === i || b.b === i) used += b.o; });
      let val = v + (['N', 'P', 'O', 'S'].includes(a.el) ? a.q : a.el === 'B' ? -a.q : a.el === 'C' ? -Math.abs(a.q) : 0);

  }
  snapAngle(A, p) { const a = Math.atan2(p.y - A.y, p.x - A.x); return Math.round(a / (Math.PI / 6)) * (Math.PI / 6); }

    }

  }
  // ---------- 그리기 ----------
  hCount(i) {

    let val = v; if (['N', 'P'].includes(a.el)) val += a.q; else if (['O', 'S'].includes(a.el)) val += a.q; else if (a.el === 'C') val -= Math.abs(a.q); else if (a.el === 'B') val -= a.q;

  fit() {
    const w = this.svg.clientWidth || 600, h = this.svg.clientHeight || 360;
    if (!this.atoms.length) { this.scale = 38; this.ox = w / 2; this.oy = h / 2; return; }
    const xs = this.atoms.map(a => a.x), ys = this.atoms.map(a => a.y);
    const bw = Math.max(...xs) - Math.min(...xs) || 1, bh = Math.max(...ys) - Math.min(...ys) || 1;

  }
  redraw(drag) {
    const w = this.svg.clientWidth, h = this.svg.clientHeight; if (!w) return;
    if (!this.inited) { this.inited = true; this.fit(); }
    this.svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const S = this.scale, out = [];
    const ringCenter = (bi) => { // 이중결합 안쪽선 방향: 고리 중심 쪽
      const b = this.bonds[bi]; const na = this.nbrs(b.a).filter(k => k !== b.b), nb = this.nbrs(b.b).filter(k => k !== b.a);
      const pts = [...na, ...nb].map(k => this.atoms[k]); if (!pts.length) return null;

    };

    this.bonds.forEach((b, bi) => {
      const A = this.atoms[b.a], B = this.atoms[b.b];
      let x1 = this.sx(A.x), y1 = this.sy(A.y), x2 = this.sx(B.x), y2 = this.sy(B.y);
      const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L, px = -uy, py = ux;
      const cut = S * 0.3; if (labeled(b.a)) { x1 += ux * cut; y1 += uy * cut; } if (labeled(b.b)) { x2 -= ux * cut; y2 -= uy * cut; }
      const hl = bi === this.hoverB, col = hl ? '#0b5cad' : '#24292f', sw = hl ? 2.6 : 1.6;
      const line = (dx, dy, sh = 0) => out.push(`<line x1="${x1 + dx + ux * sh}" y1="${y1 + dy + uy * sh}" x2="${x2 + dx - ux * sh}" y2="${y2 + dy - uy * sh}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`);
      const g = S * 0.16;
      if (b.o === 1) line(0, 0);
      else if (b.o === 2) {
        const c = ringCenter(bi), inner = c && (this.nbrs(b.a).length > 1 && this.nbrs(b.b).length > 1);
        if (inner) { const s = Math.sign((this.sx(c.x) - x1) * px + (this.sy(c.y) - y1) * py) || 1; line(0, 0); line(px * g * s, py * g * s, S * 0.14); }
        else { line(px * g / 2, py * g / 2); line(-px * g / 2, -py * g / 2); }
      } else { line(0, 0); line(px * g, py * g); line(-px * g, -py * g); }
    });

      const x = this.sx(a.x), y = this.sy(a.y), sel = this.sel.has(i), hv = i === this.hover;
      if (sel) out.push(`<circle cx="${x}" cy="${y}" r="${S * 0.32}" fill="#ddf4ff" stroke="#0b5cad" stroke-width="1"/>`);
      if (hv) out.push(`<circle cx="${x}" cy="${y}" r="${S * 0.3}" fill="none" stroke="#0b5cad" stroke-width="1.5"/>`);
      if (!labeled(i)) return;

      const qs = a.q ? (Math.abs(a.q) > 1 ? Math.abs(a.q) : '') + (a.q > 0 ? '+' : '−') : '';
      out.push(`<text x="${x}" y="${y + fs * 0.36}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="${ECOLOR[a.el] || '#24292f'}" stroke="#fff" stroke-width="4" paint-order="stroke">${txt}</text>`);
      if (qs) out.push(`<text x="${x + fs * (0.55 + (hc ? 0.5 : 0))}" y="${y - fs * 0.25}" font-size="${fs * 0.75}" font-weight="700" fill="#24292f" stroke="#fff" stroke-width="3" paint-order="stroke">${qs}</text>`);
    });
    if (drag && drag.moved && (this.tool === 'select' || this.tool === 'erase')) {
      const x0 = this.sx(Math.min(drag.p0.x, drag.p.x)), y0 = this.sy(Math.min(drag.p0.y, drag.p.y));
      out.push(`<rect x="${x0}" y="${y0}" width="${Math.abs(drag.p.x - drag.p0.x) * S}" height="${Math.abs(drag.p.y - drag.p0.y) * S}" fill="${this.tool === 'erase' ? 'rgba(207,34,46,.08)' : 'rgba(11,92,173,.08)'}" stroke="${this.tool === 'erase' ? '#cf222e' : '#0b5cad'}" stroke-dasharray="4 3"/>`);
    } else if (drag && drag.moved && drag.ai >= 0 && ['b1', 'b2', 'b3', 'el'].includes(this.tool)) {
      const A = this.atoms[drag.ai], an = this.snapAngle(A, drag.p);
      out.push(`<line x1="${this.sx(A.x)}" y1="${this.sy(A.y)}" x2="${this.sx(A.x + Math.cos(an))}" y2="${this.sy(A.y + Math.sin(an))}" stroke="#0b5cad" stroke-width="2" stroke-dasharray="4 3"/>`);
    } else if (drag && drag.moved && this.tool === 'chain') {
      const A = drag.ai >= 0 ? this.atoms[drag.ai] : drag.p0, pts = this.chainPoints(A, drag.p, drag.ai);
      if (pts.length) {
        const all = [A, ...pts];
        out.push(`<polyline points="${all.map(q => this.sx(q.x) + ',' + this.sy(q.y)).join(' ')}" fill="none" stroke="#0b5cad" stroke-width="2.2" stroke-linejoin="round" opacity=".75"/>`);
        all.forEach(q => out.push(`<circle cx="${this.sx(q.x)}" cy="${this.sy(q.y)}" r="2.6" fill="#0b5cad"/>`));
        const E = pts[pts.length - 1], cnt = pts.length + (drag.ai >= 0 ? 0 : 1);
        out.push(`<g><rect x="${this.sx(E.x) + 10}" y="${this.sy(E.y) - 24}" width="${String(cnt).length * 9 + 22}" height="22" rx="6" fill="#0b5cad"/><text x="${this.sx(E.x) + 21}" y="${this.sy(E.y) - 8}" font-size="14" font-weight="700" fill="#fff">C${cnt}</text></g>`);
      }
    }
    const bad = this.valenceIssues(); this.badAtoms = bad;
    bad.forEach((msg, i) => { const a = this.atoms[i]; if (a) out.push(`<circle cx="${this.sx(a.x)}" cy="${this.sy(a.y)}" r="${S * 0.42}" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="3 2"><title>${msg}</title></circle>`); });
    if (this.warnEl) this.warnEl.textContent = bad.size ? '⚠ ' + [...new Set(bad.values())].join(' · ') : '';
    if (!this.atoms.length) out.push(`<text x="${w / 2}" y="${h / 2}" text-anchor="middle" fill="#8c959f" font-size="14">여기에 그리거나, ChemDraw에서 Copy As → SMILES로 복사해 Ctrl+V 하세요</text>`);
    this.svg.innerHTML = out.join('');
  }
  // ---------- OpenChemLib 변환 ----------
  fromOCL(m) {
    const atoms = [], bonds = []; const n = m.getAllAtoms(); if (!n) return { atoms, bonds };
    let L = m.getAverageBondLength(true) || 1; if (!isFinite(L) || L <= 0) L = 1;
    for (let i = 0; i < n; i++) atoms.push({ x: m.getAtomX(i) / L, y: m.getAtomY(i) / L, el: m.getAtomLabel(i) || 'C', q: m.getAtomCharge(i) });
    for (let b = 0; b < m.getAllBonds(); b++) bonds.push({ a: m.getBondAtom(0, b), b: m.getBondAtom(1, b), o: Math.min(3, Math.max(1, m.getBondOrder(b))) });

  }
  setMolecule(m) {
    this.push(); const t = this.fromOCL(m); this.atoms = t.atoms; this.bonds = t.bonds; this.sel.clear(); this.fit(); this.changed();
  }
  getMolecule() {
    const M = window.S.OCL.Molecule, m = new M(this.atoms.length, this.bonds.length);
    this.atoms.forEach(a => { const i = m.addAtom(EL[a.el] ?? 6); m.setAtomX(i, a.x * 1.5); m.setAtomY(i, a.y * 1.5); if (a.q) m.setAtomCharge(i, a.q); });

  }
}
window.MolEditor = MolEditor;

</script>
