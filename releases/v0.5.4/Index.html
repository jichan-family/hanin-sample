<!DOCTYPE html>
<!-- 한인정밀화학 샘플 관리 — Index.html · 버전 v0.5.4 · 최종 수정 2026-11-26 · 최초 제작 2026-11-25 -->
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ink:#17212b; --sub:#5b6773; --mute:#8a96a3; --line:#dfe4ea; --bg:#f2f4f7; --card:#fff; --nav:#14304d; --nav2:#1d4168;
    --accent:#1260b4; --accent-l:#e6f0fb; --hanin:#1f6feb; --ls:#1a7f37; --jy:#c4520a; --cw:#6e7781;
    --ok:#1a7f37; --ok-l:#e3f4e7; --warn:#9a6700; --warn-l:#fff4d1; --bad:#c9252d; --bad-l:#fdecec; --r:10px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 14px; color:var(--ink); }
  button:hover { border-color:#b9c3ce; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover { background:#0e4f95; }
  button.ghost { border-color:transparent; background:none; color:var(--sub); }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.45; cursor:default; }
  button.sm { padding:3px 10px; font-size:12.5px; border-radius:6px; }
  input, select, textarea { font:inherit; color:var(--ink); }
  .in, .f input:not([type=checkbox]):not([type=radio]):not([type=file]), .f select, .tbl input {
    width:100%; height:38px; padding:0 11px; border:1px solid #cfd6de; border-radius:8px; background:#fff; }
  .in:focus, .f input:focus, .f select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-l); }
  textarea { width:100%; font-family:Consolas,monospace; font-size:12px; border:1px solid #cfd6de; border-radius:8px; padding:8px; }
  .hint { color:var(--mute); font-size:12.5px; }

  /* 레이아웃 */
  #app { display:flex; min-height:100vh; }
  #side { width:216px; flex:none; background:var(--nav); color:#dce6f1; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand { padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.08); }
  .brand b { display:block; color:#fff; font-size:16px; letter-spacing:-.2px; }
  .brand span { font-size:12px; color:#9fb3c8; }
  .nav { display:flex; align-items:center; gap:10px; width:calc(100% - 16px); margin:2px 8px; padding:10px 12px; border:0; border-radius:8px; background:none; color:#c9d6e3; text-align:left; font-size:14px; }
  .nav svg { width:18px; height:18px; flex:none; }
  .nav:hover { background:rgba(255,255,255,.07); color:#fff; }
  .nav.on { background:#fff; color:var(--nav); font-weight:700; }
  .navgap { height:10px; }
  .sidefoot { margin-top:auto; padding:12px 8px 14px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:6px; }
  .sidefoot .primary { margin:0 8px; background:#2f80d8; border-color:#2f80d8; }
  #lockBtn { margin:0 8px; background:rgba(255,255,255,.08); border-color:transparent; color:#dce6f1; }
  #foot { font-size:11px; color:#7f95ab; padding:2px 10px; line-height:1.5; }
  #main { flex:1; min-width:0; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); padding:18px 26px 0; }
  .ttl { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .ttl h1 { font-size:20px; margin:0; flex:1; letter-spacing:-.3px; }
  .page { padding:0 26px 40px; }
  .tplwarn { margin:0 26px 12px; }

  /* 목록 필터 */
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); }
  .tab { border:0; border-bottom:3px solid transparent; border-radius:0; background:none; padding:9px 14px; color:var(--sub); font-size:14px; }
  .tab.on { border-bottom-color:var(--accent); color:var(--ink); font-weight:700; }
  .tab .n { font-size:12px; color:var(--mute); margin-left:3px; }
  .bar { display:flex; gap:8px; padding:12px 0; align-items:center; flex-wrap:wrap; }
  .chips { display:flex; gap:6px; }
  .chip { border-radius:16px; padding:5px 13px; font-size:13px; background:#fff; color:var(--sub); }
  .chip.on { background:var(--nav); border-color:var(--nav); color:#fff; font-weight:600; }
  .chip .n { opacity:.7; margin-left:3px; font-size:12px; }
  .bar .search { flex:1; min-width:240px; }
  #structPanel { display:none; background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:12px; }
  #structPanel.open { display:block; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  #status { color:var(--sub); font-size:13px; padding:2px 0 8px; }

  /* 카드 */
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { position:relative; background:var(--card); border-radius:var(--r); overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(16,32,48,.06), 0 2px 8px rgba(16,32,48,.05); border:1px solid #e6eaef; transition:box-shadow .15s, transform .15s; }
  .card:hover { box-shadow:0 4px 16px rgba(16,32,48,.12); transform:translateY(-1px); }
  .struct { position:relative; height:170px; display:flex; align-items:center; justify-content:center; background:#fff; border-bottom:1px solid #eef1f4; padding:6px; }
  .struct svg { max-width:100%; max-height:100%; }
  .stbadge { position:absolute; top:8px; left:8px; z-index:1; }
  .olddot { position:absolute; top:10px; right:10px; width:8px; height:8px; border-radius:50%; background:#c4cbd3; }
  .monos { display:flex; align-items:center; justify-content:center; gap:2px; width:100%; height:100%; }
  .monos .m { flex:1; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .monos .m svg { max-height:120px; }
  .monos .m small { font-size:11px; color:var(--sub); }
  .monos .m.mod { border:1.5px dashed #e3a44a; border-radius:8px; }
  .monos .plus { color:var(--mute); font-weight:700; }
  .nostruct { color:var(--mute); font-size:12.5px; text-align:center; line-height:1.6; }
  .body { padding:11px 14px 13px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .no { display:inline-block; font-family:Consolas,monospace; font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:5px; background:#eef2f6; color:var(--sub); align-self:flex-start; }
  .no.한인 { background:#e6efff; color:var(--hanin); } .no.엘에스켐 { background:#e3f4e7; color:var(--ls); } .no.제이와이트리켐 { background:#fdeee3; color:var(--jy); } .no.케미웍스 { background:#eef0f2; color:var(--cw); }
  .name { font-weight:700; font-size:16px; word-break:break-all; letter-spacing:-.2px; }
  .chem { color:var(--sub); font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
  .meta { font-size:12px; color:var(--mute); }
  .badges { display:flex; gap:4px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  .b { font-size:11.5px; padding:2px 8px; border-radius:10px; border:1px solid; white-space:nowrap; background:#fff; font-weight:600; }
  .b.한인 { color:var(--hanin); border-color:#9cbcf5; } .b.엘에스켐 { color:var(--ls); border-color:#8fcca0; } .b.제이와이트리켐 { color:var(--jy); border-color:#f0b48d; } .b.케미웍스 { color:var(--cw); border-color:#c2c8ce; }
  .b.etc, .b.미출고 { color:var(--mute); border-color:var(--line); font-weight:400; }
  .b.ok { color:var(--ok); border-color:#9ad3a8; background:var(--ok-l); }
  .b.wait { color:var(--warn); border-color:#e8c766; background:var(--warn-l); }
  .b.bad { color:var(--bad); border-color:#f2a3a6; background:var(--bad-l); }
  .b.info { color:var(--accent); border-color:#a9c8ec; background:var(--accent-l); }
  .b.score { color:#fff; background:var(--accent); border-color:var(--accent); }
  .b.big { font-size:13px; padding:3px 11px; }

  /* 창 */
  .modal { position:fixed; inset:0; background:rgba(15,25,38,.45); display:none; align-items:flex-start; justify-content:center; z-index:20; overflow:auto; padding:32px 14px; }
  .modal.open { display:flex; }
  .sheet { background:#fff; border-radius:14px; width:100%; max-width:860px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .sh { display:flex; align-items:center; gap:10px; padding:18px 22px 14px; border-bottom:1px solid #eef1f4; }
  .sh h2 { font-size:18px; margin:0; flex:1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; letter-spacing:-.3px; }
  .sh .x { border:0; background:none; font-size:22px; color:var(--mute); padding:0 4px; line-height:1; }
  .sb { padding:16px 22px; }
  .sf { display:flex; gap:8px; justify-content:flex-end; align-items:center; padding:14px 22px; border-top:1px solid #eef1f4; background:#fafbfc; border-radius:0 0 14px 14px; }
  .sf .sp { flex:1; }
  .sumline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--sub); padding:10px 22px; background:#f7f9fb; border-bottom:1px solid #eef1f4; }
  .box { border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; background:#fff; }
  .box h3 { font-size:14.5px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .box h3 .sp { flex:1; }
  .box .desc { font-size:12.5px; color:var(--mute); margin:-4px 0 10px; }
  .f { display:grid; gap:10px 12px; grid-template-columns:repeat(6,1fr); }
  .f > div { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .f label { font-size:12.5px; color:var(--sub); font-weight:600; }
  .f .c1 { grid-column:span 1; } .f .c2 { grid-column:span 2; } .f .c3 { grid-column:span 3; } .f .c4 { grid-column:span 4; } .f .c6 { grid-column:span 6; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg label { position:relative; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span { display:inline-block; padding:7px 14px; border:1px solid #cfd6de; border-radius:8px; background:#fff; font-size:13.5px; color:var(--sub); cursor:pointer; user-select:none; }
  .seg input:checked + span { background:var(--accent-l); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .seg input:checked + span.한인 { background:#e6efff; border-color:var(--hanin); color:var(--hanin); }
  .seg input:checked + span.엘에스켐 { background:#e3f4e7; border-color:var(--ls); color:var(--ls); }
  .seg input:checked + span.제이와이트리켐 { background:#fdeee3; border-color:var(--jy); color:var(--jy); }
  .seg input:checked + span.케미웍스 { background:#eef0f2; border-color:var(--cw); color:var(--cw); }
  .msg { font-size:12.5px; margin-left:4px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .warn { background:var(--warn-l); border:1px solid #ecd27a; border-radius:8px; padding:9px 12px; font-size:13px; margin-top:10px; line-height:1.6; }
  .warn:empty { display:none; }
  .warn.err { background:var(--bad-l); border-color:#f2a3a6; }
  .wl { font-size:12.5px; color:var(--warn); line-height:1.7; }
  .wl div::before { content:'⚠ '; }
  .detailStruct { height:280px; display:flex; justify-content:center; align-items:center; border:1px solid #eef1f4; border-radius:var(--r); margin-bottom:14px; background:#fff; }
  .detailStruct.small { height:auto; min-height:70px; padding:10px; }
  .detailStruct .monos .m svg { max-height:220px; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:7px 12px; font-size:13.5px; }
  .kv > div:nth-child(odd) { color:var(--mute); }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th, .tbl td { border-bottom:1px solid #eef1f4; padding:7px 8px; text-align:left; vertical-align:middle; }
  .tbl th { color:var(--mute); font-weight:600; font-size:12.5px; }
  .tbl input { height:32px; font-size:13px; }
  .empty { color:var(--mute); font-size:13px; padding:4px 0; }
  .edit-only, .edit-cell { display:none !important; }
  body.editing .edit-only { display:inline-block !important; }
  body.editing button.nav.edit-only { display:flex !important; }
  body.editing div.edit-only, body.editing section.edit-only { display:block !important; }
  body.editing .edit-cell { display:table-cell !important; }

  /* 편집기 */
  .editorBox { width:100%; }
  .me-host { display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; height:560px; background:#fff; }
  .me-side { width:164px; flex:none; background:#f6f8fa; border-right:1px solid var(--line); padding:10px 8px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; }
  .me-grp { display:grid; grid-template-columns:repeat(3,44px); gap:5px; }
  .me-btn { width:44px; height:40px; display:flex; align-items:center; justify-content:center; padding:0; border:1px solid #d0d7de; border-radius:8px; background:#fff; color:var(--ink); }
  .me-btn:hover { border-color:var(--accent); }
  .me-btn svg { width:24px; height:24px; }
  .me-btn.on { background:var(--accent-l); border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .me-els .me-btn { font-size:15px; }
  .me-clear { width:142px; font-size:13px; font-weight:600; }
  .me-main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .me-tpls { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
  .me-tlabel { font-size:12.5px; color:var(--sub); margin-right:2px; }
  .me-tpl { padding:4px 11px; border-radius:14px; font-size:12.5px; }
  .me-tpl.on { background:var(--accent-l); border-color:var(--accent); color:var(--accent); }
  .me-svg { flex:1; width:100%; min-height:0; outline:none; cursor:crosshair; touch-action:none; font-family:Arial,sans-serif; }
  .me-help { padding:7px 12px; font-size:12.5px; color:var(--sub); border-top:1px solid var(--line); background:#fff; }
  .me-warn { padding:0 12px 6px; font-size:12.5px; color:var(--bad); background:#fff; }
  .me-warn:empty { display:none; }
  .small-ed .me-host { height:440px; }

  .ion, .pc { font-size:12.5px; background:#f7f9fb; border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-top:8px; line-height:1.75; }
  .ion:empty, .pc:empty { display:none; }
  .mrow { display:grid; grid-template-columns:86px 120px 1fr 130px auto; gap:8px; align-items:center; margin-bottom:8px; }
  .mrow .thumb { width:86px; height:58px; border:1px dashed #cfd6de; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff; font-size:11.5px; color:var(--mute); overflow:hidden; }
  .mrow .thumb:hover { border-color:var(--accent); color:var(--accent); }
  .mrow .thumb svg { max-width:100%; max-height:100%; }
  .mrow input { height:36px; padding:0 10px; border:1px solid #cfd6de; border-radius:8px; width:100%; }

  /* 서류 */
  .doccard { border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; }
  .doccard h3 { margin:0 0 4px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .doccard .desc { font-size:12.5px; color:var(--mute); margin-bottom:10px; }
  .doccard .act { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .doccard.done { background:#f6fbf7; border-color:#bfe3c8; }
  .blocked { font-size:12.5px; color:var(--bad); }
  .linkbtn { border:0; background:none; color:var(--accent); padding:0; text-decoration:underline; font-size:12.5px; }

  /* MSDS */
  .back { display:inline-flex; align-items:center; gap:4px; }
  .msdsGrid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start; }
  .prev { position:sticky; top:90px; }
  .solvbtns { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .solvbtns button { padding:5px 11px; font-size:13px; border-radius:16px; }
  .solvbtns button:disabled { opacity:.35; }
  .srow { display:grid; grid-template-columns:1fr 110px auto; gap:8px; align-items:center; padding:8px 10px; border:1px solid #eef1f4; border-radius:8px; margin-bottom:6px; background:#fafbfc; }
  .srow b { font-size:13.5px; } .srow small { color:var(--mute); font-size:12px; display:block; }
  .srow .pct { display:flex; align-items:center; gap:4px; }
  .srow .pct input { height:34px; text-align:right; padding:0 8px; border:1px solid #cfd6de; border-radius:8px; width:80px; }
  .sumbar { height:8px; border-radius:4px; background:#eef1f4; overflow:hidden; margin:8px 0 4px; display:flex; }
  .sumbar i { display:block; height:100%; }
  .sumtxt { font-size:12.5px; }
  .pics { display:flex; gap:6px; margin:4px 0; }
  .pics img { width:54px; height:54px; }
  .settabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .dirty { color:var(--warn); font-size:12.5px; }
  .need input { border-color:#e8c766 !important; background:#fffbea !important; }
  .f small.use { font-size:11.5px; color:var(--mute); font-weight:400; }
  @media (max-width:980px) {
    #side { width:64px; } .brand span, .brand b, .nav .t, #foot, .sidefoot .t { display:none; }
    .nav { justify-content:center; padding:10px 0; } .msdsGrid { grid-template-columns:1fr; } .prev { position:static; }
    .f { grid-template-columns:repeat(2,1fr); } .f .c3, .f .c4, .f .c6 { grid-column:span 2; } .f .c1 { grid-column:span 1; }
  }

  /* v0.5.0 */
  .b.co { color:var(--c); border-color:var(--c); }
  .no.co { background:color-mix(in srgb, var(--c) 12%, white); color:var(--c); }
  .seg input:checked + span.co { background:color-mix(in srgb, var(--c) 12%, white); border-color:var(--c); color:var(--c); }
  .cardhead { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .cardhead .name { flex:1; min-width:0; }
  .cas { font-size:12px; color:var(--sub); font-family:Consolas,monospace; }
  .dash { color:var(--mute); }
  .dtabs { display:flex; gap:2px; padding:0 22px; border-bottom:1px solid #eef1f4; background:#fff; }
  .dgrid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start; }
  .dgrid .detailStruct { margin-bottom:0; height:300px; }
  .kv2 { display:grid; grid-template-columns:70px 1fr 70px 1fr; gap:8px 10px; font-size:13.5px; align-items:baseline; }
  .kv2 > .k { color:var(--mute); font-size:12.5px; }
  .kv2 > .full { grid-column:2 / -1; word-break:break-all; }
  .meta-foot { font-size:12px; color:var(--mute); margin-top:12px; }
  .exrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:9px 0; border-bottom:1px solid #eef1f4; font-size:13px; }
  .exrow:last-child { border-bottom:0; }
  .exrow b { min-width:84px; }
  .docbtns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .docbtns .lbl { font-size:12.5px; color:var(--sub); margin-right:2px; }
  .docbtns button { padding:5px 11px; font-size:13px; }
  .docbtns button.off { opacity:.45; }
  .scard { border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:10px; }
  .scard .shead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; }
  .scard .shead .sp { flex:1; }
  .scard .line { font-size:12.5px; color:var(--sub); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .formbox { border:1px dashed #cfd6de; border-radius:8px; padding:10px 12px; background:#fafbfc; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; }
  .pcard { background:#fff; border:1px solid #e6eaef; border-radius:var(--r); padding:14px 16px; cursor:pointer; box-shadow:0 1px 2px rgba(16,32,48,.05); display:flex; flex-direction:column; gap:6px; }
  .pcard:hover { box-shadow:0 4px 14px rgba(16,32,48,.1); }
  .pcard h4 { margin:0; font-size:15.5px; display:flex; align-items:center; gap:6px; }
  .pcard .sub { font-size:12.5px; color:var(--mute); }

  .stampbox { width:90px; height:90px; border:1px dashed #cfd6de; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#fff; }

  textarea.plain { font-family:inherit; font-size:13px; min-height:90px; }
  @media (max-width:980px) { .dgrid { grid-template-columns:1fr; } .kv2 { grid-template-columns:70px 1fr; } .kv2 > .full { grid-column:2; } }

  /* v0.5.1 */
  .sh h2 .no { font-size:12px; line-height:18px; padding:2px 8px; align-self:center; }
  .sh h2 .dn { line-height:1.2; }

  .shsums { margin-top:14px; border-top:1px solid #eef1f4; padding-top:10px; }

  .shsum:hover { background:#f4f7fa; }
  .shsum .d { color:var(--mute); font-variant-numeric:tabular-nums; min-width:84px; }
  .shsum .sp { flex:1; }
  .modal .sheet { max-width:min(100%, var(--mw, 980px)); min-width:0; }
  .modal .sheet * { min-width:0; }
  .modal .sf { position:sticky; bottom:0; z-index:2; }
  .bulk textarea { width:100%; min-height:140px; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; border:1px solid #cfd6de; border-radius:8px; padding:8px; box-sizing:border-box; }
  .bulk table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px; }
  .bulk td, .bulk th { border-bottom:1px solid #eef1f4; padding:6px; text-align:left; vertical-align:top; }
  .bulk td.svg svg { display:block; }
  .upkv { display:grid; grid-template-columns:80px 1fr; gap:10px 12px; font-size:13.5px; align-items:center; }
  .upkv > .k { color:var(--mute); font-size:12.5px; }
  .upkv input { height:32px; border:1px solid #cfd6de; border-radius:6px; padding:0 8px; font-size:13px; }
  a.abtn { display:inline-block; background:var(--accent); color:#fff; font-weight:600; border-radius:8px; padding:7px 14px; text-decoration:none; }
  .nav.hasnew .t::after { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:#e5534b; margin-left:6px; vertical-align:middle; }
  .kv1 { display:grid; grid-template-columns:64px 1fr; gap:9px 12px; font-size:13.5px; align-content:start; }
  .kv1 > .k { color:var(--mute); font-size:12.5px; padding-top:1px; }
  .kv1 > div:not(.k) { word-break:break-word; }
  .docrow { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid #eef1f4; font-size:13.5px; flex-wrap:wrap; }
  .docrow:first-child { border-top:0; }
  .docrow .sp { flex:1; }
  .docrow.off b { color:var(--mute); }
  .wmini { font-size:12px; color:var(--warn); }
  .dsm { height:30px; border:1px solid #cfd6de; border-radius:6px; padding:0 8px; font:inherit; font-size:12.5px; }
  .selfed { padding:6px 0 10px; }
  .scdocs { margin-top:8px; border-top:1px solid #eef1f4; }
  .xdbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; font-size:13px; color:var(--sub); }
  .xdbar select, .xdbar input { height:32px; border:1px solid #cfd6de; border-radius:6px; padding:0 8px; font:inherit; font-size:13px; }
</style>
</head>
<body>
<div id="app">
<aside id="side">

<main id="main">
<div id="tplWarn" class="warn err tplwarn" style="display:none"></div>

<section id="view_list">

      <div class="chips" id="kinds"></div>
      <input class="in search" type="search" id="q" placeholder="관리번호, 제품명, 물질명, CAS, 용도, 고객사로 검색" oninput="S.q=this.value; render()">
      <button onclick="toggleStruct()" title="ChemDraw에서 Edit → Copy As → SMILES로 복사해 Ctrl+V. 공통 골격만 그리면 더 많이 찾습니다.">구조 검색</button>
      <select class="in" id="sort" style="width:auto" onchange="S.sort=this.value; render()">
        <option value="new">최신순</option><option value="num">관리번호순</option><option value="name">제품명순</option>
      </select>

  </div>
  <div class="page">
    <div id="structPanel">

          <label><input type="radio" name="smode" value="exact"><span>완전일치</span></label>

        <button onclick="clearStruct()">지우기</button>
        <button class="primary" onclick="runStruct()">검색</button>

    </div>
    <div id="status">불러오는 중…</div>
    <div id="zeroHint" class="row" style="display:none;margin:0 0 10px"><span class="hint">결합 종류(단일·이중)가 달라 못 찾았을 수 있습니다.</span><button class="sm" onclick="document.getElementById('skel').checked=true;runStruct()">골격만 비교로 다시 찾기</button></div>
    <div id="grid"></div>

</section>

<section id="view_partners" style="display:none">
  <div class="top"><div class="ttl"><button class="ghost back" onclick="goBack()">← 돌아가기</button><h1>거래처</h1><button class="primary edit-only" id="ptAdd" onclick="openPartner()">+ 추가</button></div>

            <div class="c1"><label>함량(%)</label><input id="m_pct" type="number" step="any" oninput="msdsPreview()"></div>

          <span id="m_msg" class="msg"></span>
        </div>
      </div>
      <div class="prev"><div class="box"><h3>미리보기</h3><div id="m_prev"></div></div></div>
